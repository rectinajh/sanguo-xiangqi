name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      # --force 是必须的：过期的 tsconfig.tsbuildinfo 会让 tsc -b 直接短路成假通过
      - name: Typecheck (frontend + agent + scripts)
        run: pnpm typecheck

      - name: Unit tests (shared rules engine)
        run: pnpm test:shared

      - name: Unit tests (frontend)
        run: pnpm --filter frontend test

      - name: Frontend production build
        run: pnpm --filter frontend build

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Contract tests
        run: pnpm test:forge

      # 合约尺寸门禁。
      #
      # 为什么必须有这一步：foundry 的 code_size_limit 曾经被设成 500_000，
      # 于是 GameTable 涨到 146 KB（EIP-170 上限是 24,576 B）时 forge test
      # 依然全绿，直到真正去 anvil 部署才炸。默认 profile 现在恢复成真实上限，
      # 这里再显式检查一次，防止有人为了图方便又把它调大。
      # 注意：`forge test` 跑的是 [profile.test]（尺寸放宽），别用它的结果判断。
      - name: Contract size gate (EIP-170)
        run: pnpm size

      # 依赖告警不阻塞构建，但必须可见
      - name: Dependency audit (informational)
        run: pnpm audit --audit-level high || true
